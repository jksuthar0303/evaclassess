<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial gradient for inner red badge -->
    <radialGradient id="redGradient" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="65%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#4c0519" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Laurel Wreath & Star Ring Around Perimeter -->
  <g fill="#be123c">
    <!-- Top 5 Stars in Arc -->
    <!-- Center star -->
    <polygon points="250,15 256,33 275,33 260,44 266,62 250,51 234,62 240,44 225,33 244,33" />
    <!-- Flanking stars Left -->
    <polygon points="205,28 210,43 226,43 213,53 218,68 205,59 192,68 197,53 184,43 200,43" />
    <polygon points="160,55 164,68 178,68 167,77 171,90 160,82 149,90 153,77 142,68 156,68" />
    <!-- Flanking stars Right -->
    <polygon points="295,28 300,43 316,43 303,53 308,68 295,59 282,68 287,53 274,43 290,43" />
    <polygon points="340,55 344,68 358,68 347,77 351,90 340,82 329,90 333,77 322,68 336,68" />

    <!-- Left Laurel Leaves -->
    <ellipse cx="115" cy="95" rx="14" ry="24" transform="rotate(-40 115 95)" />
    <ellipse cx="80" cy="135" rx="14" ry="24" transform="rotate(-55 80 135)" />
    <ellipse cx="55" cy="180" rx="14" ry="24" transform="rotate(-70 55 180)" />
    <ellipse cx="45" cy="230" rx="14" ry="24" transform="rotate(-85 45 230)" />
    <ellipse cx="45" cy="280" rx="14" ry="24" transform="rotate(-100 45 280)" />
    <ellipse cx="58" cy="330" rx="14" ry="24" transform="rotate(-115 58 330)" />
    <ellipse cx="85" cy="375" rx="14" ry="24" transform="rotate(-130 85 375)" />
    <ellipse cx="120" cy="415" rx="14" ry="24" transform="rotate(-145 120 415)" />
    <ellipse cx="165" cy="445" rx="14" ry="24" transform="rotate(-160 165 445)" />

    <!-- Right Laurel Leaves -->
    <ellipse cx="385" cy="95" rx="14" ry="24" transform="rotate(40 385 95)" />
    <ellipse cx="420" cy="135" rx="14" ry="24" transform="rotate(55 420 135)" />
    <ellipse cx="445" cy="180" rx="14" ry="24" transform="rotate(70 445 180)" />
    <ellipse cx="455" cy="230" rx="14" ry="24" transform="rotate(85 455 230)" />
    <ellipse cx="455" cy="280" rx="14" ry="24" transform="rotate(100 455 280)" />
    <ellipse cx="442" cy="330" rx="14" ry="24" transform="rotate(115 442 330)" />
    <ellipse cx="415" cy="375" rx="14" ry="24" transform="rotate(130 415 375)" />
    <ellipse cx="380" cy="415" rx="14" ry="24" transform="rotate(145 380 415)" />
    <ellipse cx="335" cy="445" rx="14" ry="24" transform="rotate(160 335 445)" />
  </g>

  <!-- Outer White Bevel Ring -->
  <circle cx="250" cy="250" r="186" fill="white" filter="url(#shadow)" />

  <!-- Main Red Circular Badge -->
  <circle cx="250" cy="250" r="176" fill="url(#redGradient)" />
  <circle cx="250" cy="250" r="171" fill="none" stroke="white" stroke-width="2.5" opacity="0.6" />

  <!-- Hindi Main Text: ईवा -->
  <g filter="url(#textShadow)">
    <text
      x="250"
      y="210"
      font-family="'Hind', 'Noto Sans Devanagari', 'Mukta', 'Arial Black', sans-serif"
      font-size="102"
      font-weight="900"
      fill="#ffffff"
      text-anchor="middle"
      letter-spacing="1"
    >
      ईवा
    </text>
  </g>

  <!-- Hindi Secondary Text: क्लासेज -->
  <g filter="url(#textShadow)">
    <text
      x="250"
      y="278"
      font-family="'Hind', 'Noto Sans Devanagari', 'Mukta', 'Arial Black', sans-serif"
      font-size="54"
      font-weight="900"
      fill="#ffffff"
      text-anchor="middle"
      letter-spacing="2"
    >
      क्लासेज
    </text>
  </g>

  <!-- Subtitle: — BIKANER — -->
  <g>
    <!-- Left Divider Line -->
    <line x1="105" y1="312" x2="175" y2="312" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text
      x="250"
      y="319"
      font-family="'Montserrat', 'Arial Black', sans-serif"
      font-size="28"
      font-weight="900"
      fill="#ffffff"
      text-anchor="middle"
      letter-spacing="4"
    >
      BIKANER
    </text>
    <!-- Right Divider Line -->
    <line x1="325" y1="312" x2="395" y2="312" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Open Book at Bottom -->
  <g transform="translate(130, 335)" filter="url(#shadow)">
    <!-- Red Book Spine Backing -->
    <path
      d="M5 45 Q 60 40 115 55 Q 120 57 125 55 Q 180 40 235 45 L 235 140 Q 180 135 125 150 Q 120 152 115 150 Q 60 135 5 140 Z"
      fill="#9f1239"
      stroke="#4c0519"
      stroke-width="3"
    />

    <!-- White Left Book Page -->
    <path
      d="M18 20 Q 65 15 115 28 L 115 126 Q 65 113 18 118 Z"
      fill="#ffffff"
      stroke="#1e293b"
      stroke-width="3.5"
    />
    <!-- Left Page Text Lines -->
    <line x1="32" y1="38" x2="100" y2="38" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="48" x2="100" y2="48" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="58" x2="100" y2="58" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="68" x2="100" y2="68" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="78" x2="100" y2="78" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="88" x2="100" y2="88" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="98" x2="100" y2="98" stroke="#334155" stroke-width="2.5" />
    <line x1="32" y1="108" x2="90" y2="108" stroke="#334155" stroke-width="2.5" />

    <!-- White Right Book Page -->
    <path
      d="M125 28 Q 175 15 222 20 L 222 118 Q 175 113 125 126 Z"
      fill="#ffffff"
      stroke="#1e293b"
      stroke-width="3.5"
    />
    <!-- Right Page Text Lines -->
    <line x1="140" y1="38" x2="208" y2="38" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="48" x2="208" y2="48" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="58" x2="208" y2="58" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="68" x2="208" y2="68" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="78" x2="208" y2="78" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="88" x2="208" y2="88" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="98" x2="208" y2="98" stroke="#334155" stroke-width="2.5" />
    <line x1="140" y1="108" x2="198" y2="108" stroke="#334155" stroke-width="2.5" />

    <!-- Central Book Fold / Spine -->
    <line x1="120" y1="28" x2="120" y2="135" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
